<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bunker</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // SDK Telegram грузим только внутри мини-аппа; в обычном браузере он не нужен
      if (
        location.hash.includes("tgWebAppData") ||
        (sessionStorage.getItem("__telegram__initParams") || "").includes("tgWebAppData") ||
        window.TelegramWebviewProxy
      ) {
        document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
